<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mel Moto Peças | Login</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="login-body">
    <main class="login-page">
        <section class="login-card"><img class="login-logo-image" src="./assets/img/LogoMelMotoPeças.jpeg"
                alt="Logo oficial Mel Moto Peças"><span class="eyebrow">MEL MOTO PEÇAS</span>
            <h1>Entrar no sistema</h1>
            <p class="login-subtitle">Acesse seu gerenciamento de estoque.</p>
            <form id="loginForm">
                <div class="input-group"><label for="loginUser">Usuário</label><input id="loginUser" type="text"
                        placeholder="Digite seu usuário" autocomplete="username" required></div>
                <div class="input-group"><label for="loginPassword">Senha</label><input id="loginPassword"
                        type="password" placeholder="Digite sua senha" autocomplete="current-password" required></div>
                <button class="button button-primary full-width" type="submit">Entrar</button>
            </form>
            <div id="loginMessage" class="form-message"></div>
            <p class="auth-links">Ainda não possui conta? <a href="./cadastro.html">Cadastre-se</a></p>
            <p class="auth-links"><a href="./index.html">Voltar à página inicial</a></p>
        </section>
    </main>
    <script src="./assets/js/ui.js"></script>
    <script src="./assets/js/login.js"></script>
</body>

</html>
